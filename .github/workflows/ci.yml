# Deterministic CI for useAgent - the fast, hermetic gate that runs on every push
# and PR. Three jobs run in parallel (typecheck / backend tests / frontend), each
# under ~10 min with bun's install cache warm.
#
# WHAT IS *NOT* HERE, ON PURPOSE — these stay MANUAL (see backend/package.json +
# CLAUDE.md "Test + ops arsenal"), because they are non-deterministic, cost real
# money, or need a browser + a full running stack:
#   • `bun run e2e:real`  — provisions REAL Daytona sandboxes + real opencode +
#                           real LLM tokens + the live memory gateway. Spends money,
#                           timing-dependent. Release-gate it locally with E2E_STRICT=1.
#   • `bun run soak`      — hours-long storm marathon; a regression soak, not a gate.
#   • ui-sweep (Playwright over system Chrome) — needs a live FE+BE stack on real
#                           ports and a desktop Chrome; run it on an isolated
#                           instance (see backend/test/e2e/ui-sweep/README.md).
# Keeping CI to the hermetic subset is what lets it stay green-means-green.
name: CI

on:
  push:
    branches:
      - main
    paths-ignore:
      - "docs-site/**"
  pull_request:
    paths-ignore:
      - "docs-site/**"

# A newer push to the same ref supersedes an in-flight run — no wasted minutes.
concurrency:
  # Push and pull_request use different refs for the same branch. Keying by the
  # PR head name collapses those duplicate full matrices into one current run.
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  # Pin the runtime so CI matches the machines that produced the lockfiles.
  BUN_VERSION: "1.3.14"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  compose-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      RELEASE_COMMIT: ${{ github.sha }}
      BETTER_AUTH_SECRET: ci-auth-0123456789abcdef0123456789abcdef
      SECRETS_ENCRYPTION_KEY: "1111111111111111111111111111111122222222222222222222222222222222"
      USEAGENT_OPERATOR_SECRET: ci-operator-0123456789abcdef0123456789abcdef
      PROVIDER_GATEWAY_SECRET: ci-provider-0123456789abcdef0123456789abcdef
      TOOL_GATEWAY_SECRET: ci-tool-0123456789abcdef0123456789abcdef0123
      GATEWAY_PUBLIC_URL: https://gateway.invalid
      SANDBOX_PROVIDER: daytona
      COMPOSE_BAKE: "true"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Start the local stack and wait for health
        run: docker compose -f compose.local.yaml up --build --wait --wait-timeout 300
      - name: Probe all service health routes
        run: >-
          node -e "Promise.all([
          fetch('http://127.0.0.1:3201/api/health'),
          fetch('http://127.0.0.1:3202/health'),
          fetch('http://127.0.0.1:3400/healthz')
          ]).then(rs => { if (rs.some(r => !r.ok)) process.exit(1) })"
      - name: Stop the local stack
        if: always()
        run: docker compose -f compose.local.yaml down --volumes --remove-orphans

  # ── Types across both apps (root `typecheck` = frontend tsc + backend tsc) ────
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ hashFiles('frontend/bun.lock', 'backend/bun.lock', 'packages/*/bun.lock') }}
          restore-keys: bun-store-${{ runner.os }}-
      # Root `typecheck` runs the frontend tsc AND the backend tsc, so both apps
      # need their deps installed first.
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - run: bun install --frozen-lockfile
        working-directory: backend
      # file:-linked packages do not install their own deps transitively - a
      # package's imports (@useagent/artifact-workspace etc.) only resolve after
      # an install INSIDE that package dir. Root typecheck spans every package,
      # so install them all. This was the chronic CI red.
      - name: Install shared package deps
        run: |
          for p in packages/*/; do
            if [ -f "$p/package.json" ]; then (cd "$p" && bun install --frozen-lockfile); fi
          done
      - run: bun run typecheck

  # ── Backend unit/integration tests against an isolated Postgres ──────────────
  backend-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        # Migrations create the vector extension, so plain postgres:16 cannot
        # represent the production schema. Pin the upstream pgvector image to
        # the same Postgres major instead of letting CI fail during bootstrap.
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        # Passwordless `postgres` superuser so the test defaults connect verbatim
        # (test/prepare-db.ts → postgres://postgres@localhost:5432/postgres,
        #  test/preload.ts → .../useagent_test). No env override needed.
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ hashFiles('backend/bun.lock', 'packages/*/bun.lock') }}
          restore-keys: bun-store-${{ runner.os }}-
      - run: bun install --frozen-lockfile
        working-directory: backend
      # Backend tests import packages/artifact-formats (docx etc.) through file:
      # links, so the linked packages need their own installs here too.
      - name: Install shared package deps
        run: |
          for p in packages/*/; do
            if [ -f "$p/package.json" ]; then (cd "$p" && bun install --frozen-lockfile); fi
          done
      - name: PostgreSQL identity deploy contracts
        run: >-
          bun test
          ./backend/src/db/gateway-grants.test.ts
          ./backend/src/commands/admission-ownership.test.ts
      # `bun run test` = prepare-db (DROP+CREATE useagent_test) then `bun test`.
      # The boot migrator builds the schema from committed Drizzle migrations, so
      # a schema drift fails here. preload.ts strips LLM keys → fully deterministic.
      - name: bun run test
        working-directory: backend
        run: bun run test

  # ── Reusable harness/client contracts ──────────────────────────────────────
  # These packages carry the provider-neutral event vocabulary, reconnect
  # reducer, conformance contract and sandbox contract. Typechecking alone
  # cannot catch semantic regressions in replay, deduplication or capability
  # projection, nor the sandbox contract's import-boundary (it must stay a pure
  # leaf, importing no backend/frontend/provider code).
  package-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        package: [agent-harness, agent-client, conformance, sandbox-contract, sandbox-daytona, sandbox-cube, sandbox-box, cli]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ matrix.package }}-${{ hashFiles('packages/*/bun.lock') }}
          restore-keys: bun-store-${{ runner.os }}-${{ matrix.package }}-
      - name: Install this package and its file:-linked siblings
        run: |
          for p in packages/*/; do
            if [ -f "$p/package.json" ]; then (cd "$p" && bun install --frozen-lockfile); fi
          done
      - run: bun run typecheck
        working-directory: packages/${{ matrix.package }}
      - run: bun run test
        working-directory: packages/${{ matrix.package }}

  # ── Private production release/rollback contracts ─────────────────────────
  # useagent-pro versions the Hetzner lane so the application commit is also
  # the immutable ops identity. Keep its hermetic canaries, rollback harnesses,
  # strict TypeScript project, and shell syntax in the same required CI graph.
  private-ops:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-private-ops-${{ hashFiles('frontend/bun.lock', 'backend/bun.lock', 'packages/*/bun.lock') }}
          restore-keys: bun-store-${{ runner.os }}-private-ops-
      - run: bun install --frozen-lockfile
        working-directory: backend
      # Private model/runtime contracts import the frontend's advertised model
      # surface. Install its file:-linked workspace exactly as the frontend job
      # does instead of relying on a developer machine's existing node_modules.
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - name: Install shared package deps
        run: |
          for p in packages/*/; do
            if [ -f "$p/package.json" ]; then (cd "$p" && bun install --frozen-lockfile); fi
          done
      - name: Private release contracts
        run: bun test deploy/hetzner deploy/compose scripts/assert-oss-sync-safe.test.ts
      - name: Private release TypeScript
        run: frontend/node_modules/.bin/tsc --project deploy/hetzner/tsconfig.json --noEmit
      - name: Private release shell syntax
        run: |
          find deploy/hetzner -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          bash -n deploy/hetzner/skynet-record-start deploy/hetzner/skynet-record-stop

  # ── Frontend: chat logic tests + a real production build ─────────────────────
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-${{ hashFiles('frontend/bun.lock', 'packages/*/bun.lock') }}
          restore-keys: bun-store-${{ runner.os }}-
      - run: bun install --frozen-lockfile
        working-directory: frontend
      # file:-linked packages do not install their own deps transitively - a
      # package's imports (@useagent/artifact-workspace etc.) only resolve after
      # an install INSIDE that package dir. Root typecheck spans every package,
      # so install them all. This was the chronic CI red.
      - name: Install shared package deps
        run: |
          for p in packages/*/; do
            if [ -f "$p/package.json" ]; then (cd "$p" && bun install --frozen-lockfile); fi
          done
      # Chat is the surface we own end-to-end; its store/timeline/part-renderer
      # logic is pure and deterministic.
      - name: bun run test
        working-directory: frontend
        run: bun run test
      # Next 16 production build — catches type/route/build regressions the dev
      # server hides. Rewrites resolve at runtime, so no backend is needed.
      - name: bun run build
        working-directory: frontend
        run: bun run build
