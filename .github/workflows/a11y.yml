# Accessibility gate for the five main product pages (issue #77): an
# @axe-core/playwright sweep (WCAG 2.0/2.1/2.2 A+AA) over home (new thread),
# a thread, Settings, Bots and Tasks, run the way the product runs - the real
# frontend build against the real backend with the real migration-built schema
# and mock-engine thread fixtures, no app code mocked. Serious and critical
# violations fail this job; the report and per-page screenshots upload as
# artifacts either way (frontend/test/a11y/sweep.ts is the audit).
#
# Kept as its own workflow (not a ci.yml job) for the same reason the ci.yml
# header gives: ci.yml stays the fast hermetic gate with no browser and no
# running stack; this one needs Chrome and a live FE+BE, like compose-health.
name: a11y

on:
  push:
    branches:
      - main
      - v2
    paths:
      - "frontend/**"
      - ".github/workflows/a11y.yml"
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/a11y.yml"

concurrency:
  group: a11y-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

env:
  BUN_VERSION: "1.3.14"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  axe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # Same image the backend-test job pins: the boot migrator's 0048 needs
        # the vector extension, plain postgres:16 cannot build the schema.
        image: pgvector/pgvector:0.8.6-pg16-bookworm
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres@localhost:5432/useagent_a11y
      BETTER_AUTH_SECRET: ci-a11y-0123456789abcdef0123456789abcdef
      SECRETS_ENCRYPTION_KEY: "1111111111111111111111111111111122222222222222222222222222222222"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache bun install store
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-store-${{ runner.os }}-a11y-${{ hashFiles('frontend/bun.lock', 'backend/bun.lock', 'packages/*/bun.lock') }}
          restore-keys: bun-store-${{ runner.os }}-a11y-
      # file:-linked packages do not install their deps transitively (see the
      # ci.yml typecheck job) - the backend runtime and the frontend build both
      # import them, so every package needs its own install.
      - run: bun install --frozen-lockfile
        working-directory: backend
      - run: bun install --frozen-lockfile
        working-directory: frontend
      - name: Install shared package deps
        run: |
          for p in packages/*/; do
            if [ -f "$p/package.json" ]; then (cd "$p" && bun install --frozen-lockfile); fi
          done
      - name: Create the audit database
        run: psql "$DATABASE_URL" -c "CREATE DATABASE useagent_a11y"
        env:
          DATABASE_URL: postgres://postgres@localhost:5432/postgres
      - name: Start the backend (dev org, mock engine, fast scripted trace)
        run: |
          cd backend
          PORT=3611 \
          DATABASE_URL=postgres://postgres@localhost:5432/useagent_a11y \
          USEAGENT_DEV_MODE=true \
          ALLOW_DEV_ORG=1 \
          MEMORY_API_URL="" \
          WORKER_STEP_DELAY_MS=1 \
          FRONTEND_ORIGIN=http://localhost:3620 \
          BETTER_AUTH_SECRET=$BETTER_AUTH_SECRET \
          SECRETS_ENCRYPTION_KEY=$SECRETS_ENCRYPTION_KEY \
          nohup bun src/index.ts > /tmp/backend.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3611/api/health && break
            sleep 2
          done
          curl -sf http://localhost:3611/api/health
      - name: Build and start the frontend
        run: |
          cd frontend
          USEAGENT_API_ORIGIN=http://localhost:3611 bun run build
          USEAGENT_API_ORIGIN=http://localhost:3611 nohup ./node_modules/.bin/next start -p 3620 > /tmp/frontend.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3620/healthz && break
            sleep 2
          done
          curl -sf http://localhost:3620/healthz
      - name: Run the accessibility audit (serious and critical fail)
        run: bun test/a11y/sweep.ts
        working-directory: frontend
        env:
          FE_ORIGIN: http://localhost:3620
          BE_ORIGIN: http://localhost:3611
          A11Y_REPORT_DIR: /tmp/a11y-report/
      - name: Show backend and frontend logs when the audit failed
        if: failure()
        run: |
          tail -n 100 /tmp/backend.log || true
          tail -n 100 /tmp/frontend.log || true
      - name: Upload the axe report and per-page screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: a11y-report
          path: /tmp/a11y-report/
          retention-days: 14
