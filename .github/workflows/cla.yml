name: CLA

# Asks every pull request author who has not signed CLA.md to sign it by
# commenting the sign line, and records each signature in
# signatures/version1/cla.json on the cla-signatures branch. The action only
# calls the GitHub API: nothing here checks out or runs pull request code, so
# pull_request_target (needed to comment on pull requests from forks) is safe.
# The action is archived upstream; it stays pinned to its last release.
#
# path-to-document follows CLA.md on main. A wording change keeps
# signatures/version1 (owner, 2026-10-18), so earlier signers are not asked again.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions: {}

jobs:
  cla:
    name: CLA
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
      (github.event.comment.body == 'recheck' ||
      github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    permissions:
      actions: write # re-run the failed check once the last signature is in
      contents: write # write the signatures file
      pull-requests: write # comment, and lock a closed pull request
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/useagenthq/useagent/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: abhishekgahlot2,useagent-user,dependabot[bot]
          # Only this exact line signs (case and outer spaces aside). Without it the
          # action accepts any one-line comment that contains the phrase.
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
