<svg xmlns="http://www.w3.org/2000/svg" width="960" height="528" viewBox="0 0 960 528" role="img" aria-label="useAgent system architecture: browser UI, /api rewrite, Bun + Hono backend, Postgres event log, engine adapters in a Daytona sandbox">
  <title>useAgent system architecture</title>
  <defs>
    <marker id="arr-accent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#3392ff"/>
    </marker>
    <marker id="arr-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#a3a3a3"/>
    </marker>
  </defs>

  <g font-family="Inter, system-ui, sans-serif">
    <!-- canvas -->
    <rect x="0" y="0" width="960" height="528" rx="12" fill="#f7f7f7"/>

    <!-- trust boundary -->
    <text x="650" y="34" font-size="11" fill="#737373" text-anchor="middle">harness stays outside the sandbox</text>
    <line x1="650" y1="46" x2="650" y2="505" stroke="#d4d4d4" stroke-width="1" stroke-dasharray="4 4"/>

    <!-- browser -->
    <rect x="32" y="120" width="160" height="172" rx="10" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
    <text x="48" y="150" font-size="13" font-weight="600" fill="#171717">Browser</text>
    <text x="48" y="176" font-size="11.5" fill="#404040">Next 16 UI</text>
    <text x="48" y="196" font-size="11" fill="#737373">frontend/ (React 19)</text>
    <text x="48" y="216" font-size="11" fill="#737373">renders the event log</text>

    <!-- request arrow: browser -> backend -->
    <text x="254" y="128" font-size="11" fill="#737373" text-anchor="middle">/api/:path* rewrite</text>
    <text x="254" y="143" font-size="10.5" fill="#737373" text-anchor="middle">next.config.ts</text>
    <line x1="196" y1="155" x2="308" y2="155" stroke="#3392ff" stroke-width="1.5" marker-end="url(#arr-accent)"/>

    <!-- SSE return arrow: backend -> browser -->
    <line x1="316" y1="279" x2="200" y2="279" stroke="#3392ff" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr-accent)"/>
    <text x="254" y="299" font-size="10.5" fill="#737373" text-anchor="middle">SSE thread-events</text>

    <!-- backend container -->
    <rect x="316" y="64" width="290" height="252" rx="10" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
    <text x="332" y="92" font-size="13" font-weight="600" fill="#171717">Bun + Hono backend</text>
    <text x="332" y="110" font-size="11" fill="#737373">backend/src (listens :3201)</text>

    <rect x="332" y="124" width="258" height="54" rx="8" fill="#f7f7f7" stroke="#ebebeb" stroke-width="1"/>
    <text x="344" y="145" font-size="12" font-weight="600" fill="#171717">runs/routes.ts</text>
    <text x="344" y="163" font-size="11" fill="#737373">POST /api/runs · cancel · reply</text>

    <rect x="332" y="188" width="258" height="54" rx="8" fill="#f7f7f7" stroke="#ebebeb" stroke-width="1"/>
    <text x="344" y="209" font-size="12" font-weight="600" fill="#171717">worker.ts</text>
    <text x="344" y="227" font-size="11" fill="#737373">claimNextRun · runProviderTurn</text>

    <rect x="332" y="252" width="258" height="54" rx="8" fill="#f7f7f7" stroke="#ebebeb" stroke-width="1"/>
    <text x="344" y="273" font-size="12" font-weight="600" fill="#171717">SSE fan-out</text>
    <text x="344" y="291" font-size="10.5" fill="#737373">GET /api/runs/:rootRunId/thread-events</text>

    <!-- spawn arrow: worker -> sandbox -->
    <rect x="602" y="178" width="98" height="32" fill="#f7f7f7"/>
    <text x="651" y="190" font-size="10.5" fill="#737373" text-anchor="middle">spawn engine</text>
    <text x="651" y="203" font-size="10.5" fill="#737373" text-anchor="middle">one-shot per run</text>
    <line x1="606" y1="215" x2="690" y2="215" stroke="#3392ff" stroke-width="1.5" marker-end="url(#arr-accent)"/>

    <!-- provider events return: sandbox -> backend -->
    <line x1="696" y1="279" x2="612" y2="279" stroke="#a3a3a3" stroke-width="1.5" marker-end="url(#arr-gray)"/>
    <rect x="602" y="285" width="98" height="32" fill="#f7f7f7"/>
    <text x="651" y="297" font-size="10.5" fill="#737373" text-anchor="middle">engine output</text>
    <text x="651" y="310" font-size="10.5" fill="#737373" text-anchor="middle">provider_events</text>

    <!-- daytona sandbox -->
    <rect x="696" y="90" width="232" height="230" rx="10" fill="#ffffff" stroke="#ebebeb" stroke-width="1"/>
    <text x="712" y="118" font-size="13" font-weight="600" fill="#171717">Daytona sandbox</text>
    <text x="712" y="136" font-size="10.5" fill="#737373">sandboxes/daytona-provider.ts</text>

    <rect x="712" y="150" width="200" height="52" rx="8" fill="#f7f7f7" stroke="#ebebeb" stroke-width="1"/>
    <text x="724" y="170" font-size="12" font-weight="600" fill="#171717">OpenCode</text>
    <text x="724" y="187" font-size="10.5" fill="#737373">engines/opencode-server.ts</text>

    <rect x="712" y="212" width="200" height="52" rx="8" fill="#f7f7f7" stroke="#ebebeb" stroke-width="1"/>
    <text x="724" y="232" font-size="12" font-weight="600" fill="#171717">Claude · Codex</text>
    <text x="724" y="249" font-size="10.5" fill="#737373">engines/acp-server.ts (ACP)</text>

    <text x="712" y="296" font-size="10.5" fill="#737373">repo + tool work happens here</text>

    <!-- append arrow: backend -> postgres -->
    <line x1="461" y1="316" x2="461" y2="366" stroke="#3392ff" stroke-width="1.5" marker-end="url(#arr-accent)"/>
    <text x="473" y="345" font-size="11" fill="#737373">append runs + steps</text>

    <!-- postgres (source of truth, accent tinted) -->
    <rect x="316" y="372" width="290" height="128" rx="10" fill="#eef6ff" stroke="#a9d3ff" stroke-width="1"/>
    <text x="332" y="399" font-size="13" font-weight="600" fill="#171717">Postgres</text>
    <rect x="494" y="382" width="96" height="20" rx="10" fill="#3392ff"/>
    <text x="542" y="396" font-size="10" font-weight="600" fill="#ffffff" text-anchor="middle">source of truth</text>
    <text x="332" y="429" font-size="11.5" fill="#404040">runs · steps · provider_events</text>
    <text x="332" y="449" font-size="11" fill="#404040">canonical_events · canonicalization_outbox</text>
    <text x="332" y="475" font-size="11" fill="#737373">db/schema.ts · event-sourced, append-only</text>
  </g>
</svg>
