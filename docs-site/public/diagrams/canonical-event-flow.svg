<svg viewBox="0 0 960 500" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="cef-title">
  <title id="cef-title">Event flow: provider events through the canonical lane to the thread stream and the UI reducer</title>
  <defs>
    <marker id="cef-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3392ff"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="500" rx="12" fill="#f7f7f7"/>

  <g font-family="Inter, system-ui, sans-serif">

    <!-- Band 1: engine adapters -> provider_events -->
    <rect x="64" y="44" width="240" height="86" rx="10" fill="#ffffff" stroke="#ebebeb"/>
    <text x="80" y="72" font-size="13" font-weight="600" fill="#171717">Engine adapters</text>
    <text x="80" y="92" font-size="11" fill="#737373">opencode-server.ts / acp-server.ts</text>
    <text x="80" y="110" font-size="11" fill="#737373">native frames from a one-shot run</text>

    <rect x="480" y="44" width="250" height="86" rx="10" fill="#ffffff" stroke="#ebebeb"/>
    <text x="496" y="72" font-size="13" font-weight="600" fill="#171717">provider_events</text>
    <rect x="611" y="59" width="62" height="17" rx="8.5" fill="#f7f7f7" stroke="#ebebeb"/>
    <text x="642" y="71" font-size="10" fill="#737373" text-anchor="middle">Postgres</text>
    <text x="496" y="92" font-size="11" fill="#737373">raw native sidecar, one row per part</text>
    <text x="496" y="110" font-size="11" fill="#737373">per-run monotonic seq</text>

    <line x1="304" y1="87" x2="474" y2="87" stroke="#3392ff" stroke-width="1.5" marker-end="url(#cef-arrow)"/>
    <text x="390" y="78" font-size="11" fill="#737373" text-anchor="middle">recordProviderEvent()</text>

    <!-- Into the canonical lane -->
    <line x1="605" y1="130" x2="605" y2="170" stroke="#3392ff" stroke-width="1.5" marker-end="url(#cef-arrow)"/>
    <text x="617" y="155" font-size="11" fill="#737373">due runs from canonicalization_outbox</text>

    <!-- Band 2: the canonical lane worker -->
    <rect x="64" y="176" width="832" height="128" rx="10" fill="#fbfbfb" stroke="#ebebeb"/>
    <text x="84" y="201" font-size="13" font-weight="600" fill="#171717">Canonical lane</text>
    <text x="196" y="201" font-size="11" fill="#737373">runs/canonicalization-outbox.ts worker</text>

    <rect x="84" y="216" width="232" height="68" rx="10" fill="#ffffff" stroke="#ebebeb"/>
    <text x="100" y="243" font-size="13" font-weight="600" fill="#171717">claimDue()</text>
    <text x="100" y="262" font-size="11" fill="#737373">FOR UPDATE SKIP LOCKED</text>

    <line x1="316" y1="250" x2="358" y2="250" stroke="#3392ff" stroke-width="1.5" marker-end="url(#cef-arrow)"/>

    <rect x="364" y="216" width="232" height="68" rx="10" fill="#ffffff" stroke="#ebebeb"/>
    <text x="380" y="243" font-size="13" font-weight="600" fill="#171717">drainProviderEvents()</text>
    <text x="380" y="262" font-size="11" fill="#737373">seal in-flight source writes</text>

    <line x1="596" y1="250" x2="638" y2="250" stroke="#3392ff" stroke-width="1.5" marker-end="url(#cef-arrow)"/>

    <rect x="644" y="216" width="232" height="68" rx="10" fill="#ffffff" stroke="#ebebeb"/>
    <text x="660" y="243" font-size="13" font-weight="600" fill="#171717">canonicalizeRun()</text>
    <text x="660" y="262" font-size="11" fill="#737373">stable watermark, atomic write</text>

    <!-- Down into the canonical events table -->
    <path d="M760,304 V330 H187 V346" fill="none" stroke="#3392ff" stroke-width="1.5" marker-end="url(#cef-arrow)"/>
    <text x="473" y="322" font-size="11" fill="#737373" text-anchor="middle">persist before publish, then publishDelivered()</text>

    <!-- Band 3: table -> thread SSE -> UI reducer -->
    <rect x="64" y="352" width="270" height="96" rx="10" fill="#e9f3ff" stroke="#b9dbff"/>
    <text x="80" y="380" font-size="13" font-weight="600" fill="#171717">canonical_events</text>
    <rect x="202" y="365" width="104" height="17" rx="8.5" fill="#3392ff"/>
    <text x="254" y="377" font-size="10" fill="#ffffff" text-anchor="middle">source of truth</text>
    <text x="80" y="402" font-size="11" fill="#737373">append-only rows, deliverySeq cursor</text>
    <text x="80" y="420" font-size="11" fill="#737373">replay and live converge on these rows</text>

    <line x1="334" y1="400" x2="374" y2="400" stroke="#3392ff" stroke-width="1.5" marker-end="url(#cef-arrow)"/>

    <rect x="378" y="352" width="272" height="96" rx="10" fill="#ffffff" stroke="#ebebeb"/>
    <text x="394" y="380" font-size="13" font-weight="600" fill="#171717">Thread-scoped SSE</text>
    <text x="394" y="402" font-size="11" fill="#737373">GET /api/runs/:rootRunId/thread-events</text>
    <text x="394" y="420" font-size="11" fill="#737373">runs/routes.ts: replay + live fan-out</text>

    <line x1="650" y1="400" x2="690" y2="400" stroke="#3392ff" stroke-width="1.5" marker-end="url(#cef-arrow)"/>

    <rect x="694" y="352" width="202" height="96" rx="10" fill="#ffffff" stroke="#ebebeb"/>
    <text x="710" y="380" font-size="13" font-weight="600" fill="#171717">UI reducer merge</text>
    <text x="710" y="402" font-size="11" fill="#737373">thread-store.applyCanonical()</text>
    <text x="710" y="420" font-size="11" fill="#737373">via use-thread-stream.ts</text>

  </g>
</svg>
