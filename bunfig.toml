# Supply-chain hardening for `bun install`. The same [install] block is carried
# by root, frontend/, and backend/ so every install path is covered.
#   exact             pin resolved versions in package.json instead of caret ranges.
#   minimumReleaseAge refuse versions published within the last 3 days (259200s),
#                     so a freshly-compromised release cannot be pulled in on day zero.
# Lockfiles are NOT regenerated by this change; these settings shape future installs.
[install]
exact = true
minimumReleaseAge = 259200
